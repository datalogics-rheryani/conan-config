repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
  - repo: git@github.com:datalogics/dl-pre-commit-hooks.git
    rev: 1.2.0
    hooks:
      - id: check-utf8
  - repo: local
    hooks:
      - id: conan-config-lint
        name: conan-config-lint
        description: 'Lint profiles, remotes.json and settings.yml'
        entry: python tools/lint.py
        language: python
        always_run: true
        require_serial: true
